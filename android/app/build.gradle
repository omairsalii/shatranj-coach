plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('VERSION_CODE') ?: '1') as Integer

android {
    namespace 'com.omair.shatranj'
    compileSdk 35

    defaultConfig {
        applicationId 'com.omair.shatranj'
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            // مفتاح توقيع ثابت داخل المستودع حتى تعمل التحديثات فوق النسخة السابقة دون حذف التطبيق.
            storeFile file('shatranj.keystore')
            storePassword 'shatranj123'
            keyAlias 'shatranj'
            keyPassword 'shatranj123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ملفات الواجهة تُنسخ من chess-app/web إلى src/main/assets/www قبل البناء (انظر سير العمل)
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    aaptOptions {
        noCompress 'wasm'
    }
}

dependencies {
    // يوحّد إصدارات kotlin-stdlib لتجنب تكرار الأصناف بين stdlib و stdlib-jdk7/jdk8.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
